<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PaperSphere - 論文管理＆AI解析</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      background-color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-sm">
          <i class="fa-solid fa-book-medical text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-slate-900">PaperSphere</h1>
          <p class="text-xs text-slate-500">AI論文要約＆アプリ内リーダー</p>
        </div>
      </div>

      <!-- 検索バー -->
      <div class="flex-1 max-w-md mx-2">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input id="searchInput" type="text" placeholder="タイトル・要約・対象・結果・タグで検索..."
            class="w-full pl-9 pr-4 py-2 text-sm bg-slate-100 border border-transparent rounded-xl focus:bg-white focus:border-indigo-500 focus:outline-none transition">
        </div>
      </div>

      <!-- 操作ボタン群 -->
      <div class="flex items-center gap-2">
        <button onclick="openUploadModal()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-sm font-medium px-3.5 py-2 rounded-xl shadow-sm flex items-center gap-1.5 transition">
          <i class="fa-solid fa-file-circle-plus"></i>
          <span>論文追加</span>
        </button>
        <button onclick="openSettingsModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2 rounded-xl transition" title="API設定・データ管理">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <div class="flex-1 max-w-7xl w-full mx-auto flex flex-col md:flex-row gap-4 p-4">

    <!-- 左サイドバー：カテゴリ＆タグフィルタ -->
    <aside class="w-full md:w-64 shrink-0 space-y-4">
      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-bold text-sm text-slate-700 flex items-center gap-1.5">
            <i class="fa-solid fa-folder-tree text-indigo-500"></i> カテゴリ分類
          </h2>
          <span id="totalCountBadge" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">0件</span>
        </div>
        <div id="categoryList" class="space-y-1 text-sm max-h-60 md:max-h-80 overflow-y-auto custom-scroll"></div>
      </div>

      <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
        <h2 class="font-bold text-sm text-slate-700 flex items-center gap-1.5 mb-3">
          <i class="fa-solid fa-tags text-indigo-500"></i> タグ一覧
        </h2>
        <div id="tagCloud" class="flex flex-wrap gap-1.5 max-h-40 overflow-y-auto custom-scroll"></div>
      </div>
    </aside>

    <!-- 右メイン：論文カード一覧 -->
    <main class="flex-1">
      <div id="activeFilterBar" class="hidden mb-3 flex items-center justify-between bg-indigo-50 border border-indigo-100 px-3.5 py-2 rounded-xl text-xs text-indigo-700">
        <span id="activeFilterText" class="font-medium"></span>
        <button onclick="resetFilter()" class="underline hover:text-indigo-900">フィルタ解除</button>
      </div>

      <div id="paperGrid" class="grid grid-cols-1 gap-4"></div>

      <!-- 論文が0件のとき -->
      <div id="emptyState" class="hidden bg-white rounded-2xl border border-dashed border-slate-300 p-10 text-center my-4">
        <div class="w-14 h-14 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
          <i class="fa-solid fa-file-pdf"></i>
        </div>
        <h3 class="font-bold text-slate-700 mb-1">まだ論文が登録されていません</h3>
        <p class="text-xs text-slate-500 mb-4">右上の「論文追加」からPDFを読み込むと、<br>全体の要約・対象者・実施内容・結果・考察をAIが整理し、アプリ内でPDFも読めます。</p>
        <button onclick="openUploadModal()" class="bg-indigo-600 text-white text-sm font-medium px-4 py-2 rounded-xl shadow-sm">
          最初の論文を追加する
        </button>
      </div>
    </main>
  </div>

  <!-- モーダル1：論文追加＆PDF自動解析 -->
  <div id="uploadModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-40 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
        <h3 class="font-bold text-base flex items-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles text-indigo-600"></i> 論文の追加・AI自動解析
        </h3>
        <button onclick="closeUploadModal()" class="text-slate-400 hover:text-slate-600 text-lg px-2">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-5 overflow-y-auto custom-scroll space-y-4">
        <!-- PDF選択エリア -->
        <label class="block border-2 border-dashed border-indigo-200 hover:border-indigo-400 bg-indigo-50/40 rounded-2xl p-4 text-center cursor-pointer transition">
          <input id="pdfFileInput" type="file" accept="application/pdf" class="hidden" onchange="handlePdfSelect(event)">
          <i class="fa-solid fa-cloud-arrow-up text-2xl text-indigo-500 mb-1"></i>
          <p class="text-sm font-bold text-slate-700">PDFファイルをタップして選択</p>
          <p id="pdfStatusText" class="text-xs text-slate-500 mt-1">PDF本体もアプリ内に保存され、いつでもアプリ内で読めるようになります</p>
        </label>

        <!-- AI解析ステータス -->
        <div id="aiLoadingBox" class="hidden bg-indigo-50 border border-indigo-100 text-indigo-700 px-4 py-3 rounded-xl text-sm flex items-center gap-3">
          <i class="fa-solid fa-circle-notch fa-spin text-lg"></i>
          <span id="aiLoadingText">PDFから本文を読み取ってAI解析中...</span>
        </div>

        <!-- 編集・確認フォーム -->
        <div class="space-y-3 pt-1">
          <input type="hidden" id="editPaperId">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">論文タイトル *</label>
            <input id="formTitle" type="text" placeholder="例：脳卒中片麻痺患者に対する〇〇トレーニングの効果" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">大カテゴリ（分野）</label>
              <input id="formMainCat" type="text" placeholder="例：神経系理学療法" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">小カテゴリ（疾患・テーマ）</label>
              <input id="formSubCat" type="text" placeholder="例：脳卒中・歩行" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">著者・発表年</label>
              <input id="formMeta" type="text" placeholder="例：Suzuki et al. (2025)" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">タグ（カンマ区切り）</label>
            <input id="formTags" type="text" placeholder="例：RCT, 歩行速度, 脳卒中, リハビリ" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none">
          </div>

          <!-- 論文全体の要約 -->
          <div class="bg-indigo-50/60 p-3 rounded-xl border border-indigo-100">
            <label class="block text-xs font-bold text-indigo-900 mb-1">
              <i class="fa-solid fa-file-lines mr-1 text-indigo-600"></i>論文全体の要約（ざっくり言うとどんな研究？）
            </label>
            <textarea id="formSummary" rows="2" placeholder="例：回復期脳卒中患者に対し課題指向型練習を行い、歩行速度とバランス能力の有意な改善を示したランダム化比較試験。" class="w-full p-2 text-sm bg-white border border-indigo-200 rounded-lg focus:outline-none focus:border-indigo-500"></textarea>
          </div>

          <!-- 4大項目：対象者・実施内容・結果・考察 -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
            <div class="bg-blue-50/60 p-3 rounded-xl border border-blue-100">
              <label class="block text-xs font-bold text-blue-800 mb-1">
                <i class="fa-solid fa-users mr-1"></i>① 対象者（誰に・何人・条件）
              </label>
              <textarea id="formParticipants" rows="3" placeholder="例：回復期脳卒中患者40名（介入群20名、対照群20名、平均年齢68歳）" class="w-full p-2 text-sm bg-white border border-blue-200 rounded-lg focus:outline-none focus:border-blue-500"></textarea>
            </div>

            <div class="bg-emerald-50/60 p-3 rounded-xl border border-emerald-100">
              <label class="block text-xs font-bold text-emerald-800 mb-1">
                <i class="fa-solid fa-person-walking mr-1"></i>② 実施内容（何をしたか・方法・期間）
              </label>
              <textarea id="formIntervention" rows="3" placeholder="例：通常リハに加え、週5回×4週間の課題指向型バランストレーニング（1回30分）を実施" class="w-full p-2 text-sm bg-white border border-emerald-200 rounded-lg focus:outline-none focus:border-emerald-500"></textarea>
            </div>

            <div class="bg-amber-50/60 p-3 rounded-xl border border-amber-100">
              <label class="block text-xs font-bold text-amber-800 mb-1">
                <i class="fa-solid fa-chart-column mr-1"></i>③ 結果（どうなったか・有意差）
              </label>
              <textarea id="formResults" rows="3" placeholder="例：介入群で10m歩行速度とBBSスコアが対照群に比べ有意に改善した（p<0.05）" class="w-full p-2 text-sm bg-white border border-amber-200 rounded-lg focus:outline-none focus:border-amber-500"></textarea>
            </div>

            <div class="bg-purple-50/60 p-3 rounded-xl border border-purple-100">
              <label class="block text-xs font-bold text-purple-800 mb-1">
                <i class="fa-solid fa-lightbulb mr-1"></i>④ 考察（なぜそうなったか・臨床的意義）
              </label>
              <textarea id="formDiscussion" rows="3" placeholder="例：視覚フィードバックを伴う反復練習が運動学習を促進したと考えられる。今後は長期効果の検証が必要。" class="w-full p-2 text-sm bg-white border border-purple-200 rounded-lg focus:outline-none focus:border-purple-500"></textarea>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">自分のメモ・気づき</label>
            <textarea id="formMemo" rows="2" placeholder="国試対策メモや臨床で使えそうなポイントなど自由記入" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none"></textarea>
          </div>
        </div>
      </div>

      <div class="px-5 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-2">
        <button onclick="closeUploadModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-200 rounded-xl transition">キャンセル</button>
        <button onclick="savePaper()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-5 py-2 rounded-xl shadow-sm transition">
          保存する
        </button>
      </div>
    </div>
  </div>

  <!-- モーダル2：アプリ内PDF＆本文リーダー -->
  <div id="readerModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-xs z-50 hidden flex-col">
    <!-- リーダー上部バー -->
    <div class="bg-slate-900 text-white px-4 py-3 flex items-center justify-between gap-3 border-b border-slate-700">
      <div class="flex items-center gap-2 min-w-0">
        <i class="fa-solid fa-book-open text-indigo-400"></i>
        <h3 id="readerTitle" class="font-bold text-sm sm:text-base truncate">論文ビューアー</h3>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <!-- 表示切替タブ -->
        <div class="bg-slate-800 p-1 rounded-xl flex items-center text-xs">
          <button id="tabPdfBtn" onclick="switchReaderTab('pdf')" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white font-bold transition">
            PDF原本
          </button>
          <button id="tabTextBtn" onclick="switchReaderTab('text')" class="px-3 py-1.5 rounded-lg text-slate-300 hover:text-white transition">
            抽出テキスト
          </button>
        </div>

        <!-- ズームボタン -->
        <div id="pdfZoomControls" class="hidden sm:flex items-center gap-1 bg-slate-800 px-2 py-1 rounded-xl text-xs">
          <button onclick="changePdfZoom(-0.2)" class="px-2 py-1 hover:bg-slate-700 rounded"><i class="fa-solid fa-minus"></i></button>
          <span id="zoomLevelText" class="px-1.5 font-mono">100%</span>
          <button onclick="changePdfZoom(0.2)" class="px-2 py-1 hover:bg-slate-700 rounded"><i class="fa-solid fa-plus"></i></button>
        </div>

        <button onclick="closeReaderModal()" class="bg-slate-800 hover:bg-slate-700 text-white px-3 py-1.5 rounded-xl text-sm font-bold flex items-center gap-1">
          <i class="fa-solid fa-xmark"></i> 閉じる
        </button>
      </div>
    </div>

    <!-- PDFキャンバス表示エリア -->
    <div id="readerPdfContainer" class="flex-1 overflow-y-auto p-3 sm:p-6 flex flex-col items-center gap-4 custom-scroll">
      <div id="pdfPagesWrapper" class="w-full max-w-4xl flex flex-col items-center gap-4"></div>
    </div>

    <!-- 抽出テキスト＆要約表示エリア -->
    <div id="readerTextContainer" class="hidden flex-1 overflow-y-auto p-4 sm:p-6 custom-scroll">
      <div class="max-w-3xl mx-auto bg-white rounded-2xl p-6 shadow-lg space-y-4 text-slate-800">
        <h4 class="font-bold text-sm text-indigo-600 border-b pb-2">抽出された論文テキスト全文</h4>
        <div id="readerFullText" class="text-sm leading-relaxed whitespace-pre-wrap text-slate-700"></div>
      </div>
    </div>
  </div>

  <!-- モーダル3：APIキー設定＆データ引き継ぎ -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full shadow-xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
        <h3 class="font-bold text-base flex items-center gap-2">
          <i class="fa-solid fa-gear text-slate-600"></i> 設定・データバックアップ
        </h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 text-lg px-2">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="p-5 space-y-5">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Gemini APIキー（PDF自動解析用）</label>
          <input id="apiKeyInput" type="password" placeholder="AIzaSy..." class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none">
          <p class="text-[11px] text-slate-500 mt-1">※キーはお使いのiPad/スマホ内（localStorage）にのみ安全に保存されます。</p>
          <button onclick="saveApiKey()" class="mt-2 bg-slate-800 text-white text-xs font-bold px-3.5 py-2 rounded-lg">APIキーを保存</button>
        </div>

        <hr class="border-slate-200">

        <div>
          <h4 class="text-xs font-bold text-slate-700 mb-2">データのバックアップ・復元</h4>
          <div class="flex gap-2">
            <button onclick="exportData()" class="flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold py-2.5 px-3 rounded-xl border border-indigo-200 transition">
              <i class="fa-solid fa-download mr-1"></i> JSON書き出し
            </button>
            <label class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-2.5 px-3 rounded-xl border border-slate-200 text-center cursor-pointer transition">
              <i class="fa-solid fa-upload mr-1"></i> JSON読み込み
              <input type="file" accept=".json" class="hidden" onchange="importData(event)">
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // PDF.js ワーカー設定
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const STORAGE_KEY = 'papersphere_papers_v3';
    const LEGACY_KEYS = ['papersphere_papers_v2', 'papersphere_papers', 'papers', 'paperSphereData'];
    const API_KEY_STORAGE = 'papersphere_gemini_api_key';

    // IndexedDB（PDFファイル本体の保存用）
    const DB_NAME = 'PaperSpherePDFDB';
    const DB_STORE = 'pdfs';

    let papers = [];
    let pdfSavedMap = {}; // id -> true
    let currentFilter = { type: 'all', value: '' };
    let pendingPdfBuffer = null;
    let pendingFullText = '';
    let activePdfDoc = null;
    let currentPdfScale = 1.3;

    // IndexedDB ヘルパー関数
    function openPdfDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(DB_STORE)) {
            db.createObjectStore(DB_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function savePdfToIndexedDB(paperId, arrayBuffer) {
      const db = await openPdfDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(arrayBuffer, paperId);
        tx.oncomplete = () => {
          pdfSavedMap[paperId] = true;
          resolve();
        };
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getPdfFromIndexedDB(paperId) {
      const db = await openPdfDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readonly');
        const req = tx.objectStore(DB_STORE).get(paperId);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function deletePdfFromIndexedDB(paperId) {
      const db = await openPdfDB();
      return new Promise((resolve) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).delete(paperId);
        tx.oncomplete = () => {
          delete pdfSavedMap[paperId];
          resolve();
        };
      });
    }

    async function refreshPdfSavedMap() {
      try {
        const db = await openPdfDB();
        return new Promise((resolve) => {
          const tx = db.transaction(DB_STORE, 'readonly');
          const req = tx.objectStore(DB_STORE).getAllKeys();
          req.onsuccess = () => {
            pdfSavedMap = {};
            (req.result || []).forEach(k => { pdfSavedMap[k] = true; });
            resolve();
          };
          req.onerror = () => resolve();
        });
      } catch (e) {}
    }

    // 初期読み込み
    window.addEventListener('DOMContentLoaded', async () => {
      loadPapersFromStorage();
      await refreshPdfSavedMap();
      const savedKey = localStorage.getItem(API_KEY_STORAGE) || localStorage.getItem('gemini_api_key') || '';
      document.getElementById('apiKeyInput').value = savedKey;
      document.getElementById('searchInput').addEventListener('input', renderAll);
      renderAll();
    });

    function loadPapersFromStorage() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        papers = JSON.parse(saved);
        return;
      }
      // 旧データがあれば引き継ぐ
      for (const key of LEGACY_KEYS) {
        const legacy = localStorage.getItem(key);
        if (legacy) {
          try {
            const parsed = JSON.parse(legacy);
            if (Array.isArray(parsed) && parsed.length > 0) {
              papers = parsed.map(p => ({
                id: p.id || Date.now().toString() + Math.random(),
                title: p.title || '無題の論文',
                mainCat: p.mainCat || p.category || '未分類',
                subCat: p.subCat || p.subcategory || '一般',
                meta: p.meta || p.authors || '',
                tags: Array.isArray(p.tags) ? p.tags : [],
                summary: p.summary || '',
                participants: p.participants || '（未入力）',
                intervention: p.intervention || p.methods || '（未入力）',
                results: p.results || '（未入力）',
                discussion: p.discussion || '（未入力）',
                memo: p.memo || '',
                fullText: p.fullText || '',
                createdAt: p.createdAt || new Date().toISOString()
              }));
              saveToStorage();
              break;
            }
          } catch (e) {}
        }
      }
    }

          html += `

      container.innerHTML = tags.map(t => {

    // PDFの読み込み＆Gemini APIによる要約＋4項目自動抽出
    async function handlePdfSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('pdfStatusText').textContent = `選択中: ${file.name}（保存するとアプリ内でいつでも読めます）`;
      const loadingBox = document.getElementById('aiLoadingBox');
      const loadingText = document.getElementById('aiLoadingText');
      loadingBox.classList.remove('hidden');
      loadingText.textContent = 'PDF本体をアプリに読み込み中...';

      try {
        const arrayBuffer = await file.arrayBuffer();
        // IndexedDB保存用にコピーを保持
        pendingPdfBuffer = arrayBuffer.slice(0);

        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer.slice(0) }).promise;
        let extractedText = '';
        const maxPages = Math.min(pdf.numPages, 15);

        for (let i = 1; i <= maxPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          extractedText += `--- Page ${i} ---\n` + content.items.map(item => item.str).join(' ') + '\n\n';
        }
        pendingFullText = extractedText;

        const apiKey = localStorage.getItem(API_KEY_STORAGE) || localStorage.getItem('gemini_api_key');
        if (!apiKey) {
          loadingBox.classList.add('hidden');
          if (!document.getElementById('formTitle').value) {
            document.getElementById('formTitle').value = file.name.replace(/\.pdf$/i, '');
          }
          alert('PDFの読み込みが完了しました！右上の歯車マークからGemini APIキーを登録しておくと、要約・対象・方法・結果・考察も自動で入力されます。');
          return;
        }

        loadingText.textContent = 'AIが「全体の要約・対象者・実施内容・結果・考察」を解析中...';
        const prompt = `
以下の医学・理学療法・リハビリテーション等の学術論文テキストを解析し、必ず以下のJSON形式のみで日本語で出力してください。マークダウンのコードブロックは含めず純粋なJSONのみを返してください。

{
  "title": "論文の分かりやすい日本語タイトル（英語論文の場合は日本語訳＋原題）",
  "mainCat": "大分類（例：神経系理学療法、運動器系理学療法、内部障害系、基礎医学、装具・福祉用具など）",
  "subCat": "小分類（例：脳卒中、パーキンソン病、変形性膝関節症、呼吸リハなど）",
  "meta": "第一著者名と発表年（例：Tanaka et al., 2024）",
  "tags": ["重要キーワード1", "キーワード2", "キーワード3", "キーワード4"],
  "summary": "論文全体の要約（この研究の目的・方法・結論がひと目でわかる2〜3文の簡潔な全体要約）",
  "participants": "対象者（対象疾患、人数、年齢、群分け、除外基準などを具体的に）",
  "intervention": "何を実施したか（介入方法、運動プロトコル、頻度・期間、評価指標・測定方法などを具体的に）",
  "results": "結果（主要なアウトカムの変化、数値、群間差や統計的有意差などを具体的に）",
  "discussion": "考察（結果が得られたメカニズム、臨床的意義、研究の限界・今後の課題などを簡潔に）"
}

論文テキスト:
${extractedText.slice(0, 25000)}
        `;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const data = await response.json();
        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const cleaned = rawText.replace(/```json|```/g, '').trim();
        const result = JSON.parse(cleaned);

        document.getElementById('formTitle').value = result.title || file.name.replace(/\.pdf$/i, '');
        document.getElementById('formMainCat').value = result.mainCat || '未分類';
        document.getElementById('formSubCat').value = result.subCat || '一般';
        document.getElementById('formMeta').value = result.meta || '';
        document.getElementById('formTags').value = (result.tags || []).join(', ');
        document.getElementById('formSummary').value = result.summary || '';
        document.getElementById('formParticipants').value = result.participants || '';
        document.getElementById('formIntervention').value = result.intervention || '';
        document.getElementById('formResults').value = result.results || '';
        document.getElementById('formDiscussion').value = result.discussion || '';

      } catch (err) {
        console.error(err);
        alert('AI解析中にエラーが発生しましたが、PDF自体は読み込まれています。必要に応じて手動で入力・保存してください。');
      } finally {
        loadingBox.classList.add('hidden');
      }
    }

    async function renderAllPdfPages() {
      if (!activePdfDoc) return;
      const wrapper = document.getElementById('pdfPagesWrapper');
      wrapper.innerHTML = '';
      document.getElementById('zoomLevelText').textContent = `${Math.round((currentPdfScale / 1.3) * 100)}%`;

      for (let pageNum = 1; pageNum <= activePdfDoc.numPages; pageNum++) {
        const page = await activePdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: currentPdfScale });

        const pageContainer = document.createElement('div');
        pageContainer.className = 'bg-white shadow-xl rounded-lg overflow-hidden max-w-full';

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const outputScale = window.devicePixelRatio || 1;

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = '100%';
        canvas.style.maxWidth = `${Math.floor(viewport.width)}px`;
        canvas.style.height = 'auto';

        pageContainer.appendChild(canvas);
        wrapper.appendChild(pageContainer);

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
        await page.render({ canvasContext: ctx, transform, viewport }).promise;
      }
    }

    function changePdfZoom(delta) {
      if (!activePdfDoc) return;
      currentPdfScale = Math.min(2.5, Math.max(0.7, currentPdfScale + delta));
      renderAllPdfPages();

    async function savePaper() {

        subCat: document.getElementById('formSubCat').value.trim() || '一般',
        meta: document.getElementById('formMeta').value.trim(),
        tags: document.getElementById('formTags').value.split(',').map(t => t.trim()).filter(Boolean),
        summary: document.getElementById('formSummary').value.trim(),
        participants: document.getElementById('formParticipants').value.trim(),
        intervention: document.getElementById('formIntervention').value.trim(),
        results: document.getElementById('formResults').value.trim(),
        discussion: document.getElementById('formDiscussion').value.trim(),
        memo: document.getElementById('formMemo').value.trim(),
        fullText: pendingFullText || (existing ? existing.fullText : ''),
        updatedAt: new Date().toISOString()
      };

      if (pendingPdfBuffer) {
        try {
          await savePdfToIndexedDB(paperId, pendingPdfBuffer);
        } catch (e) {
          console.error('PDF保存エラー:', e);
        }
      }

      if (id) {
        const idx = papers.findIndex(item => item.id === id);
        if (idx !== -1) papers[idx] = paperObj;
      } else {
        papers.unshift(paperObj);
      }

      saveToStorage();
      renderAll();
      closeUploadModal();
    }

    async function deletePaper(id) {
      if (!confirm('この論文データを削除してもいいですか？')) return;
      papers = papers.filter(p => p.id !== id);
      await deletePdfFromIndexedDB(id);
      saveToStorage();
      renderAll();
    }

    // 設定・バックアップ操作
    function openSettingsModal() {
      document.getElementById('settingsModal').classList.remove('hidden');
      document.getElementById('settingsModal').classList.add('flex');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.add('hidden');
      document.getElementById('settingsModal').classList.remove('flex');
    }

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem(API_KEY_STORAGE, key);
      alert('APIキーを保存しました！');
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(papers, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `papersphere_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            papers = imported;
            saveToStorage();
            renderAll();
            alert('データを復元しました！');
            closeSettingsModal();
          }
        } catch (err) {
          alert('JSONファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsText(file);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
